<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#263c2b"
    />

    <meta
      name="description"
      content="Green Cactus Fresh Mexican Grill in Stony Brook, New York. Fresh Mexican favorites made to order."
    />


    <!-- Website Icon / Favicon -->

    <link
      rel="icon"
      type="image/webp"
      href="/images/green-cactus-logo.webp"
    />


    <title>
      Green Cactus | Fresh Mexican Grill
    </title>

  </head>


  <body>

    <!--
      ==========================================
      NETLIFY FORM DETECTION
      ==========================================

      Netlify scans the generated HTML during
      deployment.

      This hidden form tells Netlify that a form
      named "contact" exists.

      The visible React form submits to this
      registered Netlify form.
    -->

    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >

      <input
        type="hidden"
        name="form-name"
        value="contact"
      />


      <!-- Honeypot -->

      <input
        name="bot-field"
      />


      <!-- Name -->

      <input
        type="text"
        name="name"
      />


      <!-- Email -->

      <input
        type="email"
        name="email"
      />


      <!-- Phone -->

      <input
        type="tel"
        name="phone"
      />


      <!-- Subject -->

      <select name="subject">

        <option value="">
          Select a topic
        </option>

        <option value="general">
          General question
        </option>

        <option value="catering">
          Catering
        </option>

        <option value="menu">
          Menu question
        </option>

        <option value="feedback">
          Feedback
        </option>

        <option value="other">
          Something else
        </option>

      </select>


      <!-- Message -->

      <textarea name="message"></textarea>

    </form>


    <!-- ========================================
         REACT APP
    ======================================== -->

    <div id="root"></div>


    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>

</html>
