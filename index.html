<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#263c2b"
    />

    <meta
      name="description"
      content="Green Cactus Fresh Mexican Grill in Stony Brook, New York. Fresh Mexican favorites made to order."
    />

    <!-- Website Icon / Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/images/green-cactus-logo.png"
    />

    <title>Green Cactus | Fresh Mexican Grill</title>
  </head>

  <body>

    <!--
      Hidden form used by Netlify to detect
      the React contact form during deployment.
    -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="contact"
      />

      <input
        name="bot-field"
      />

      <input
        type="text"
        name="name"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="tel"
        name="phone"
      />

      <select name="subject">
        <option value="general">
          General question
        </option>

        <option value="catering">
          Catering
        </option>

        <option value="menu">
          Menu question
        </option>

        <option value="feedback">
          Feedback
        </option>

        <option value="other">
          Something else
        </option>
      </select>

      <textarea name="message"></textarea>
    </form>


    <!-- React App -->
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
